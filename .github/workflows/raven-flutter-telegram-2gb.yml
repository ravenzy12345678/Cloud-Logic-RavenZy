name: Raven Large Flutter Worker

run-name: ${{ github.event.client_payload.operation || inputs.operation || 'flutter_build' }} • ${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}

on:
  repository_dispatch:
    types: [raven_flutter_build]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: false
        default: flutter_build
        type: choice
        options: [flutter_build, rename_project]
      mode:
        description: Build mode
        required: false
        default: release
        type: choice
        options: [debug, release]
      job_id:
        description: Raven build id
        required: false
        type: string
      callback_url:
        description: Raven callback URL
        required: false
        type: string
      callback_secret:
        description: Per-build callback secret
        required: false
        type: string
      source_chat_id:
        description: Telegram source chat id
        required: false
        type: string
      source_message_id:
        description: Telegram source message id
        required: false
        type: string
      source_filename:
        description: Source filename
        required: false
        type: string
      source_size:
        description: Source size in bytes
        required: false
        type: string
      project_name:
        description: Project name hint
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: raven-large-${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}
  cancel-in-progress: true

env:
  OPERATION: ${{ github.event.client_payload.operation || inputs.operation || 'flutter_build' }}
  MODE: ${{ github.event.client_payload.mode || inputs.mode || 'release' }}
  JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}
  CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url || '' }}
  CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret || inputs.callback_secret || '' }}
  SOURCE_CHAT_ID: ${{ github.event.client_payload.source_chat_id || inputs.source_chat_id || '' }}
  SOURCE_MESSAGE_ID: ${{ github.event.client_payload.source_message_id || inputs.source_message_id || '' }}
  SOURCE_SIZE: ${{ github.event.client_payload.source_size || inputs.source_size || '0' }}
  SOURCE_FILENAME: ${{ github.event.client_payload.source_filename || inputs.source_filename || 'raven-source.zip' }}
  PROJECT_NAME_HINT: ${{ github.event.client_payload.project_name || inputs.project_name || '' }}
  TOKEN_BOT: ${{ secrets.TOKEN_BOT }}
  TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  STORAGE_REPO: raven-build-storage
  RELEASE_TAG: raven-build-${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}
  MAX_SOURCE_BYTES: '2147483647'
  CB: python3 scripts/raven-callback.py

jobs:
  worker:
    name: ${{ github.event.client_payload.operation || inputs.operation || 'flutter_build' }} • ${{ github.event.client_payload.job_id || inputs.job_id || github.run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SOURCE_PATH=$RUNNER_TEMP/raven-source.zip"
            echo "PROJECT_PATH=$RUNNER_TEMP/raven-flutter-project"
            echo "WORKER_LOG=$RUNNER_TEMP/raven-worker.log"
            echo "BUILD_LOG=$RUNNER_TEMP/flutter-build.log"
            echo "OUTPUT_BASE=$RUNNER_TEMP/raven-output"
            echo "TARGET_CHAT_ID=$SOURCE_CHAT_ID"
            echo "START_EPOCH=$(date +%s)"
          } >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/raven-worker.log"
          : > "$RUNNER_TEMP/flutter-build.log"
          if [ -z "${CALLBACK_SECRET:-}" ]; then
            SECRET="$(python3 -c "import hashlib,hmac,os;print(hmac.new(os.environ.get('TOKEN_BOT','').encode(),os.environ['JOB_ID'].encode(),hashlib.sha256).hexdigest())")"
            echo "CALLBACK_SECRET=$SECRET" >> "$GITHUB_ENV"
          fi
          printf '[%s] run=%s operation=%s mode=%s job=%s\n' "$(date -Is)" "$GITHUB_RUN_ID" "$OPERATION" "$MODE" "$JOB_ID" >> "$RUNNER_TEMP/raven-worker.log"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate invocation
        id: invocation
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "$1" | tee -a "$WORKER_LOG" >&2; exit 1; }
          case "${OPERATION,,}" in
            flutter_build|rename_project) ;;
            *) fail "Operation tidak valid: $OPERATION" ;;
          esac
          if [ "${OPERATION,,}" = 'flutter_build' ]; then
            case "${MODE,,}" in debug|release) ;; *) fail "Mode build tidak valid: $MODE" ;; esac
          fi
          [ -n "$TELEGRAM_API_ID" ] || fail 'Secret TELEGRAM_API_ID belum diset'
          [ -n "$TELEGRAM_API_HASH" ] || fail 'Secret TELEGRAM_API_HASH belum diset'
          [ -n "$TOKEN_BOT" ] || fail 'Secret TOKEN_BOT belum diset'
          [ -n "$TOKEN_GITHUB" ] || fail 'Secret TOKEN_GITHUB belum diset'
          [ -n "$CALLBACK_URL" ] || fail 'CALLBACK_URL belum tersedia'
          [ -n "$SOURCE_CHAT_ID" ] || fail 'SOURCE_CHAT_ID belum tersedia'
          [ -n "$SOURCE_MESSAGE_ID" ] || fail 'SOURCE_MESSAGE_ID belum tersedia'
          if [ "$OPERATION" = 'rename_project' ]; then
            case "$PROJECT_NAME_HINT" in
              *'|||'*) REST="${PROJECT_NAME_HINT#*'|||'}"; APP="${REST%%'|||'*}" ;;
              *) APP='' ;;
            esac
            [ -n "$APP" ] || fail 'Nama aplikasi baru belum tersedia'
          fi
          $CB running WORKER_STARTING 6 "detail=Server worker sedang dimulai."

      - name: Parse project fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          raw = os.environ.get('PROJECT_NAME_HINT', '')
          sep = '|||'
          if sep in raw:
              parts = raw.split(sep, 2)
              base = parts[0]
              app = parts[1] if len(parts) > 1 else ''
              domain = parts[2] if len(parts) > 2 else ''
          else:
              base, app, domain = raw, '', ''
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('PROJECT_NAME_HINT=' + base.replace('\n', ' ') + '\n')
              handle.write('RENAME_APP_NAME=' + app.replace('\n', ' ') + '\n')
              handle.write('RENAME_DOMAIN=' + domain.replace('\n', ' ') + '\n')
          PY

      - name: Install MTProto worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip >> "$WORKER_LOG" 2>&1
          python3 -m pip install 'Telethon>=1.40,<2' >> "$WORKER_LOG" 2>&1
          python3 -m pip install cryptg >> "$WORKER_LOG" 2>&1 || true
          $CB running WORKER_READY 10 "detail=Worker Server siap mengambil source."

      - name: Download source from Telegram
        id: download
        shell: bash
        run: |
          set -euo pipefail
          $CB running TELEGRAM_CONNECTING 12 "detail=Menghubungkan ke Telegram untuk mengambil ZIP."
          python3 scripts/raven-telegram-mtproto.py download-source 2>&1 | tee -a "$WORKER_LOG"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Validate ZIP
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a "$WORKER_LOG"
          import os, zipfile
          from pathlib import PurePosixPath
          src = os.environ['SOURCE_PATH']
          size = os.path.getsize(src)
          if size <= 0:
              raise SystemExit('Source ZIP kosong.')
          if size > int(os.environ['MAX_SOURCE_BYTES']):
              raise SystemExit('Source ZIP melebihi batas maksimum.')
          if not zipfile.is_zipfile(src):
              raise SystemExit('File bukan ZIP yang valid.')
          with zipfile.ZipFile(src) as archive:
              infos = archive.infolist()
              if not infos:
                  raise SystemExit('ZIP tidak memiliki entry.')
              if len(infos) > 60000:
                  raise SystemExit(f'Terlalu banyak entry ZIP: {len(infos)}')
              total = 0
              for info in infos:
                  name = info.filename.replace('\\', '/').lstrip('/')
                  parts = PurePosixPath(name).parts
                  if '..' in parts:
                      raise SystemExit(f'Path ZIP tidak aman: {info.filename}')
                  total += int(info.file_size or 0)
                  if total > 8_000_000_000:
                      raise SystemExit('Isi ZIP setelah ekstrak melebihi 8 GB.')
          print(f'ZIP OK: {size} bytes / {len(infos)} entries / {total} uncompressed bytes')
          PY
          test "${PIPESTATUS[0]}" -eq 0
          $CB running SOURCE_VALIDATED 30 "source_filename=$SOURCE_FILENAME"

      - name: Backup source
        id: backup
        if: env.OPERATION == 'flutter_build'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          $CB running SOURCE_BACKUP_START 34 "detail=Menyimpan source build sebelum kompilasi."
          OWNER="$(gh api user --jq .login)"
          TARGET="$OWNER/$STORAGE_REPO"
          if ! gh api "repos/$TARGET" >/dev/null 2>&1; then
            gh api --method POST /user/repos -f name="$STORAGE_REPO" -f description='Private source storage for Raven builds' -F private=true -F has_issues=false -F has_projects=false -F has_wiki=false -F auto_init=true >/dev/null
            sleep 3
          fi
          [ "$(gh api "repos/$TARGET" --jq .private)" = true ] || { echo "Storage harus private: $TARGET" | tee -a "$WORKER_LOG" >&2; exit 1; }
          BRANCH="$(gh api "repos/$TARGET" --jq .default_branch)"
          if ! gh api "repos/$TARGET/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method PUT "repos/$TARGET/contents/.raven-storage" -f message='chore: bootstrap storage' -f branch="$BRANCH" -f content="$(printf 'Raven private build storage\n' | base64 -w 0)" >/dev/null
          fi
          SAFE_NAME="$(printf '%s' "$SOURCE_FILENAME" | tr -c 'A-Za-z0-9._-' '_')"
          [ -n "$SAFE_NAME" ] || SAFE_NAME=source.zip
          mkdir -p "$RUNNER_TEMP/backup"
          cp "$SOURCE_PATH" "$RUNNER_TEMP/backup/$SAFE_NAME"
          gh release delete "$RELEASE_TAG" --repo "$TARGET" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" --repo "$TARGET" --title "Raven Source $JOB_ID" --notes "Private source backup" --prerelease >/dev/null
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/backup/$SAFE_NAME" --repo "$TARGET" --clobber 2>&1 | tee -a "$WORKER_LOG"
          ASSET_ID="$(gh release view "$RELEASE_TAG" --repo "$TARGET" --json assets --jq ".assets[] | select(.name==\"$SAFE_NAME\") | .id" | head -n1)"
          SIZE="$(stat -c '%s' "$SOURCE_PATH")"
          $CB running SOURCE_BACKUP_READY 38 "source_release_tag=$RELEASE_TAG" "source_storage_owner=$OWNER" "source_storage_repo=$STORAGE_REPO" "source_asset_id=$ASSET_ID" "source_asset_filename=$SAFE_NAME" "source_size=$SIZE"

      - name: Extract Flutter project
        id: extract
        if: env.OPERATION == 'flutter_build'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee -a "$WORKER_LOG"
          import os, re, shutil, zipfile
          from pathlib import Path, PurePosixPath
          src = Path(os.environ['SOURCE_PATH'])
          dst = Path(os.environ['PROJECT_PATH'])
          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir(parents=True)
          with zipfile.ZipFile(src) as archive:
              entries = []
              for info in archive.infolist():
                  name = info.filename.replace('\\', '/')
                  while name.startswith('./'):
                      name = name[2:]
                  name = name.lstrip('/')
                  if name and not name.startswith('__MACOSX/'):
                      entries.append((info, name))
              roots = []
              for info, name in entries:
                  if info.is_dir():
                      continue
                  parts = PurePosixPath(name).parts
                  if parts[-1].lower() == 'pubspec.yaml':
                      directory = parts[:-1]
                      if any(p in ('.dart_tool', 'build', '.symlinks', 'ephemeral') for p in directory):
                          continue
                      roots.append(directory)
              if not roots:
                  raise SystemExit('pubspec.yaml tidak ditemukan di dalam ZIP.')
              roots.sort(key=lambda p: (len(p), 1 if p and p[-1].lower() in ('example', 'examples', 'test') else 0, p))
              root = roots[0]
              prefix = '/'.join(root) + '/' if root else ''
              count = 0
              for info, name in entries:
                  if info.is_dir() or not name.startswith(prefix):
                      continue
                  rel = name[len(prefix):]
                  pure = PurePosixPath(rel)
                  if not rel or pure.is_absolute() or '..' in pure.parts:
                      continue
                  out = dst.joinpath(*pure.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as reader, out.open('wb') as writer:
                      shutil.copyfileobj(reader, writer, 16 * 1024 * 1024)
                  count += 1
          for folder in ['.git', '.dart_tool', 'build', '.gradle', '.idea', '.vscode', 'coverage', 'node_modules']:
              target = dst / folder
              if target.exists():
                  shutil.rmtree(target, ignore_errors=True)
          android_build = dst / 'android' / 'build'
          if android_build.exists():
              shutil.rmtree(android_build, ignore_errors=True)
          pubspec = (dst / 'pubspec.yaml').read_text(encoding='utf-8', errors='ignore')
          match = re.search(r'^name:\s*([A-Za-z0-9_]+)', pubspec, re.M)
          name = match.group(1) if match else 'raven_flutter_app'
          if not (dst / 'lib' / 'main.dart').exists():
              raise SystemExit('lib/main.dart tidak ditemukan. Project Flutter tidak lengkap.')
          needs_android = not (dst / 'android' / 'app' / 'src' / 'main' / 'AndroidManifest.xml').exists()
          flutter_version = ''
          fvmrc = dst / '.fvmrc'
          fvm_cfg = dst / '.fvm' / 'fvm_config.json'
          try:
              import json
              if fvmrc.exists():
                  flutter_version = str(json.loads(fvmrc.read_text()).get('flutter', '')).strip()
              elif fvm_cfg.exists():
                  flutter_version = str(json.loads(fvm_cfg.read_text()).get('flutterSdkVersion', '')).strip()
          except Exception:
              flutter_version = ''
          if not re.fullmatch(r'\d+\.\d+\.\d+(\+hotfix\.\d+)?', flutter_version or ''):
              flutter_version = ''
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'FLUTTER_PROJECT_NAME={name}\n')
              handle.write(f'NEEDS_ANDROID_SCAFFOLD={"1" if needs_android else "0"}\n')
              handle.write(f'REQUESTED_FLUTTER_VERSION={flutter_version}\n')
          print(f'Flutter project: {name} / files: {count} / scaffold android: {needs_android} / flutter: {flutter_version or "stable"}')
          PY
          test "${PIPESTATUS[0]}" -eq 0
          $CB running PROJECT_VALIDATED 46 "project_name=$FLUTTER_PROJECT_NAME"

      - name: Prepare rename project
        id: rename
        if: env.OPERATION == 'rename_project'
        shell: bash
        run: |
          set -euo pipefail
          $CB running RENAME_PROCESSING 65 "detail=Membaca source dan menerapkan perubahan nama atau domain."
          python3 - <<'PY' 2>&1 | tee -a "$WORKER_LOG"
          import os, re, zipfile
          from pathlib import Path
          src = Path(os.environ['SOURCE_PATH'])
          out = Path(os.environ['OUTPUT_BASE'] + '.zip')
          new_app = os.environ['RENAME_APP_NAME'].strip()[:120]
          raw_domain = os.environ.get('RENAME_DOMAIN', '').strip()
          new_domain = ''
          if raw_domain:
              new_domain = re.sub(r'^https?://', '', raw_domain, flags=re.I).split('/')[0].strip().strip('.')

          def slug(value):
              text = re.sub(r'[^a-z0-9_]+', '_', value.lower()).strip('_')
              if not text:
                  text = 'raven_app'
              if text[0].isdigit():
                  text = 'raven_' + text
              return text[:60]

          new_pkg = slug(new_app)
          text_ext = re.compile(r'\.(dart|yaml|yml|json|xml|gradle|kts|properties|kt|java|js|ts|html|css|md|txt|arb|plist|iml|toml|ini)$', re.I)
          skip_hosts = {'pub.dev', 'github.com', 'raw.githubusercontent.com', 'google.com', 'googleapis.com', 'firebase.google.com', 'firebaseio.com', 'android.com', 'dart.dev', 'flutter.dev', 'w3.org', 'schemas.android.com', 'fonts.googleapis.com', 'localhost', '127.0.0.1', 'apache.org', 'gradle.org', 'maven.org', 'jitpack.io'}
          records = []
          with zipfile.ZipFile(src) as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename.replace('\\', '/').lstrip('/')
                  if not name or '..' in name.split('/'):
                      raise SystemExit(f'Path ZIP tidak aman: {name}')
                  records.append((name, archive.read(info)))
          old_pkg = ''
          app_candidates = []
          domain_candidates = []
          for name, data in records:
              if name.lower().endswith('pubspec.yaml') and name.count('/') <= 1:
                  match = re.search(r'^name:\s*([^#\r\n]+)', data.decode('utf-8', 'ignore'), re.M)
                  if match:
                      old_pkg = match.group(1).strip().strip('"\'')
                      break
          for name, data in records:
              if not text_ext.search(name):
                  continue
              text = data.decode('utf-8', 'ignore')
              for match in re.finditer(r'<string[^>]+name=["\']app_name["\'][^>]*>([^<]+)</string>', text, re.I):
                  value = match.group(1).strip()
                  if value:
                      app_candidates.append(value)
              for match in re.finditer(r'android:label=["\']([^"\']+)["\']', text, re.I):
                  value = match.group(1).strip()
                  if value and not value.startswith('@'):
                      app_candidates.append(value)
              for key in ('CFBundleDisplayName', 'CFBundleName'):
                  match = re.search(rf'<key>\s*{key}\s*</key>\s*<string>([^<]+)</string>', text, re.I)
                  if match:
                      app_candidates.append(match.group(1).strip())
              for match in re.finditer(r'https?://([^\s"\'<>`)]+)', text, re.I):
                  host = match.group(1).split('/')[0].split(':')[0].lower().strip('.')
                  if host and host not in skip_hosts and not host.endswith('.googleusercontent.com'):
                      domain_candidates.append(host)
          app_candidates = [x for x in dict.fromkeys(app_candidates) if len(x) > 1]
          domain_candidates = list(dict.fromkeys(domain_candidates))
          changed = 0
          result = []
          for name, data in records:
              payload = data
              if text_ext.search(name):
                  original = data.decode('utf-8', 'ignore')
                  text = original
                  if old_pkg and old_pkg != new_pkg:
                      text = text.replace(old_pkg, new_pkg)
                  for old in app_candidates:
                      if old != new_app:
                          text = text.replace(old, new_app)
                  if new_domain:
                      for host in domain_candidates:
                          text = re.sub(r'(?i)(https?://)' + re.escape(host), lambda m: m.group(1) + new_domain, text)
                          text = re.sub(r'(?<![A-Za-z0-9.-])' + re.escape(host) + r'(?![A-Za-z0-9.-])', new_domain, text, flags=re.I)
                  if text != original:
                      changed += 1
                      payload = text.encode('utf-8')
              result.append((name, payload))
          result.sort(key=lambda item: item[0])
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for name, payload in result:
                  archive.writestr(name, payload)
          if out.stat().st_size <= 0:
              raise SystemExit('Output rename kosong.')
          print(f'RENAME OK: app={new_app} package={new_pkg} changed_files={changed} size={out.stat().st_size}')
          PY
          test "${PIPESTATUS[0]}" -eq 0
          SIZE="$(stat -c '%s' "$OUTPUT_BASE.zip")"
          echo "RENAME_OUTPUT_PATH=$OUTPUT_BASE.zip" >> "$GITHUB_ENV"
          $CB running RENAME_READY 91 "output_filename=$(basename "$OUTPUT_BASE.zip")" "output_size=$SIZE"

      - name: Setup Java
        if: env.OPERATION == 'flutter_build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: env.OPERATION == 'flutter_build'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.REQUESTED_FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        if: env.OPERATION == 'flutter_build'
        uses: android-actions/setup-android@v3

      - name: Prepare toolchain
        id: toolchain
        if: env.OPERATION == 'flutter_build'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          { sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" 2>&1 | tail -n 5 | tee -a "$WORKER_LOG"; } || true
          flutter config --no-analytics >/dev/null 2>&1 || true
          flutter --version 2>&1 | tee -a "$WORKER_LOG"
          echo "[$(date -Is)] toolchain ready" | tee -a "$WORKER_LOG"
          $CB running TOOLCHAIN_READY 54 "detail=Flutter, Java 17, dan Android SDK siap."

      - name: Normalize Android project
        id: normalize
        if: env.OPERATION == 'flutter_build'
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK_ROOT" ] || { echo 'ANDROID_SDK_ROOT tidak ditemukan' | tee -a "$WORKER_LOG" >&2; exit 1; }
          [ -n "${FLUTTER_ROOT:-}" ] || { echo 'FLUTTER_ROOT tidak ditemukan' | tee -a "$WORKER_LOG" >&2; exit 1; }
          if [ "$NEEDS_ANDROID_SCAFFOLD" = "1" ]; then
            flutter create . --platforms=android --project-name "$FLUTTER_PROJECT_NAME" --no-pub 2>&1 | tee -a "$WORKER_LOG"
          fi
          test -f android/app/src/main/AndroidManifest.xml
          if [ -f android/local.properties ]; then
            awk '!/^(flutter\.sdk|sdk\.dir|flutter\.buildMode)=/' android/local.properties > android/local.properties.tmp
            mv android/local.properties.tmp android/local.properties
          fi
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$SDK_ROOT"
          } >> android/local.properties
          touch android/gradle.properties
          grep -q '^org.gradle.jvmargs' android/gradle.properties || printf '\norg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          grep -q '^android.useAndroidX' android/gradle.properties || printf 'android.useAndroidX=true\n' >> android/gradle.properties
          grep -q '^org.gradle.daemon' android/gradle.properties || printf 'org.gradle.daemon=false\n' >> android/gradle.properties
          $CB running ANDROID_READY 58 "detail=Konfigurasi Android project siap."

      - name: Flutter pub get
        id: pubget
        if: env.OPERATION == 'flutter_build'
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[$(date -Is)] flutter pub get" | tee -a "$BUILD_LOG" "$WORKER_LOG"
          flutter pub get 2>&1 | tee -a "$BUILD_LOG" "$WORKER_LOG"
          test "${PIPESTATUS[0]}" -eq 0
          $CB running DEPENDENCIES_READY 70 "detail=Dependency project berhasil disiapkan."

      - name: Build Flutter APK
        id: build
        if: env.OPERATION == 'flutter_build'
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -uo pipefail
          $CB running BUILDING_APK 78 "detail=Flutter SDK sedang mengompilasi source ke APK."
          HEARTBEAT="$RUNNER_TEMP/build-heartbeat"
          : > "$HEARTBEAT"
          START="$(date +%s)"
          (
            while [ -f "$HEARTBEAT" ]; do
              sleep 25
              [ -f "$HEARTBEAT" ] || break
              ELAPSED=$(( $(date +%s) - START ))
              P=$(( 78 + ELAPSED / 30 ))
              [ "$P" -lt 90 ] || P=89
              $CB running BUILDING_APK "$P" "detail=Flutter masih mengompilasi APK. Durasi ${ELAPSED}s." >/dev/null 2>&1 || true
            done
          ) &
          HB=$!
          FLAGS="--no-pub"
          [ "${MODE,,}" = "release" ] && FLAGS="$FLAGS --no-tree-shake-icons"
          echo "[$(date -Is)] flutter build apk --${MODE,,} $FLAGS" | tee -a "$BUILD_LOG" "$WORKER_LOG"
          flutter build apk --${MODE,,} $FLAGS 2>&1 | tee -a "$BUILD_LOG" "$WORKER_LOG"
          RC=${PIPESTATUS[0]}
          rm -f "$HEARTBEAT"
          kill "$HB" >/dev/null 2>&1 || true
          wait "$HB" >/dev/null 2>&1 || true
          exit "$RC"

      - name: Locate APK
        id: apk
        if: env.OPERATION == 'flutter_build'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_PATH/build/app/outputs" -type f -name '*.apk' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -n1 | cut -d' ' -f2-)"
          [ -n "$APK" ] || { echo 'APK tidak ditemukan setelah build.' | tee -a "$WORKER_LOG" >&2; exit 1; }
          SIZE="$(stat -c '%s' "$APK")"
          [ "$SIZE" -gt 0 ] || { echo 'APK kosong.' | tee -a "$WORKER_LOG" >&2; exit 1; }
          SAFE="$(printf '%s' "$FLUTTER_PROJECT_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          DEST="$RUNNER_TEMP/${SAFE}-${MODE,,}.apk"
          cp "$APK" "$DEST"
          {
            echo "path=$DEST"
            echo "name=$(basename "$DEST")"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "[$(date -Is)] APK ready: $(basename "$DEST") / $SIZE bytes" | tee -a "$WORKER_LOG"
          $CB running APK_READY 91 "apk_filename=$(basename "$DEST")" "apk_size=$SIZE" "project_name=$FLUTTER_PROJECT_NAME"

      - name: Send Flutter APK
        id: sendapk
        if: env.OPERATION == 'flutter_build'
        env:
          OUTPUT_KIND: apk
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_CAPTION: |
            🎉 <b>APK BUILD SELESAI!</b>
            ━━━━━━━━━━━━━━━━━━━━━

            📦 Project  : <code>${{ env.FLUTTER_PROJECT_NAME }}</code>
            🔧 Mode     : <b>${{ env.MODE }}</b>
            🖥️ Server  : Build Server

            ✅ APK siap install!
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/raven-telegram-mtproto.py send-file 2>&1 | tee -a "$WORKER_LOG"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Send renamed ZIP
        id: sendzip
        if: env.OPERATION == 'rename_project'
        env:
          OUTPUT_KIND: zip
          OUTPUT_PATH: ${{ env.RENAME_OUTPUT_PATH }}
          OUTPUT_CAPTION: |
            ✅ <b>RENAME PROJECT SELESAI</b>
            ━━━━━━━━━━━━━━━━━━━━━

            ✏️ Nama baru : <b>${{ env.RENAME_APP_NAME }}</b>
            🖥️ Server   : Build Server

            ZIP hasil rename siap dipakai.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/raven-telegram-mtproto.py send-file 2>&1 | tee -a "$WORKER_LOG"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Report failure
        if: failure()
        shell: bash
        env:
          OUT_INVOCATION: ${{ steps.invocation.outcome }}
          OUT_DOWNLOAD: ${{ steps.download.outcome }}
          OUT_VALIDATE: ${{ steps.validate.outcome }}
          OUT_EXTRACT: ${{ steps.extract.outcome }}
          OUT_RENAME: ${{ steps.rename.outcome }}
          OUT_TOOLCHAIN: ${{ steps.toolchain.outcome }}
          OUT_NORMALIZE: ${{ steps.normalize.outcome }}
          OUT_PUBGET: ${{ steps.pubget.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_APK: ${{ steps.apk.outcome }}
          OUT_SENDAPK: ${{ steps.sendapk.outcome }}
          OUT_SENDZIP: ${{ steps.sendzip.outcome }}
        run: |
          set +e
          STEP="$(python3 - <<'PY'
          import os
          order = [
              ('OUT_INVOCATION', 'Validasi Konfigurasi'),
              ('OUT_DOWNLOAD', 'Download Source'),
              ('OUT_VALIDATE', 'Validasi ZIP'),
              ('OUT_EXTRACT', 'Extract Project'),
              ('OUT_RENAME', 'Rename Project'),
              ('OUT_TOOLCHAIN', 'Setup Toolchain'),
              ('OUT_NORMALIZE', 'Konfigurasi Android'),
              ('OUT_PUBGET', 'Pub Get'),
              ('OUT_BUILD', 'Build APK'),
              ('OUT_APK', 'Cari APK'),
              ('OUT_SENDAPK', 'Kirim APK'),
              ('OUT_SENDZIP', 'Kirim ZIP'),
          ]
          step = 'Setup Worker'
          for key, label in order:
              if os.environ.get(key, '') == 'failure':
                  step = label
                  break
          print(step)
          PY
          )"
          LOG_FILE="$RUNNER_TEMP/raven-error-${JOB_ID}.txt"
          {
            echo "RAVEN BUILD ERROR LOG"
            echo "Step gagal : $STEP"
            echo "Job ID     : $JOB_ID"
            echo "Operation  : $OPERATION"
            echo "Mode       : $MODE"
            echo "Source     : $SOURCE_FILENAME"
            echo "Waktu      : $(date -Is)"
            echo "========================================"
            if [ -s "$BUILD_LOG" ]; then cat "$BUILD_LOG"; else cat "$WORKER_LOG" 2>/dev/null; fi
            echo
            echo "========================================"
            echo "WORKER LOG"
            echo "========================================"
            cat "$WORKER_LOG" 2>/dev/null
          } > "$LOG_FILE" 2>/dev/null
          if [ -n "$TOKEN_BOT" ]; then sed -i "s/$TOKEN_BOT/[REDACTED]/g" "$LOG_FILE" 2>/dev/null; fi
          if [ -n "$TOKEN_GITHUB" ]; then sed -i "s/$TOKEN_GITHUB/[REDACTED]/g" "$LOG_FILE" 2>/dev/null; fi
          [ "$(stat -c '%s' "$LOG_FILE" 2>/dev/null || echo 0)" -gt 50000000 ] && tail -c 40000000 "$LOG_FILE" > "$LOG_FILE.tail" && mv "$LOG_FILE.tail" "$LOG_FILE"
          LOG_SENT=false
          if [ -n "$SOURCE_CHAT_ID" ] && [ -n "$TELEGRAM_API_ID" ] && [ -n "$TOKEN_BOT" ]; then
            if OUTPUT_KIND=log OUTPUT_PATH="$LOG_FILE" OUTPUT_CAPTION="$(printf '📄 <b>Full Build Error Log</b>\n\nStep gagal: <b>%s</b>\n\nGunakan file ini untuk menemukan baris kode yang error secara detail.' "$STEP")" python3 scripts/raven-telegram-mtproto.py send-file; then
              LOG_SENT=true
            fi
          fi
          TAIL="$(tail -c 3500 "$LOG_FILE" 2>/dev/null)"
          $CB failure BUILD_FAILED 95 "failed_step=$STEP" "log_sent=$LOG_SENT" "operation=$OPERATION" "error=$TAIL"
          exit 0

      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: raven-${{ env.JOB_ID }}-logs
          path: |
            ${{ env.WORKER_LOG }}
            ${{ env.BUILD_LOG }}
          if-no-files-found: ignore
          retention-days: 3
