name: Raven Telegram Large Source Transfer

run-name: source-transfer • ${{ github.event.client_payload.job_id || inputs.source_release_tag || github.run_id }}

on:
  repository_dispatch:
    types: [raven_source_transfer]
  workflow_dispatch:
    inputs:
      source_storage_owner:
        description: Storage repository owner
        required: true
        type: string
      source_storage_repo:
        description: Storage repository
        required: true
        default: raven-build-storage
        type: string
      source_release_tag:
        description: Source release tag
        required: true
        type: string
      source_filename:
        description: Source filename
        required: false
        type: string
      target_chat_id:
        description: Telegram target chat id
        required: true
        type: string
      project_name:
        description: Project name
        required: false
        type: string

permissions:
  contents: read

env:
  SOURCE_OWNER: ${{ github.event.client_payload.source_storage_owner || inputs.source_storage_owner }}
  SOURCE_REPO: ${{ github.event.client_payload.source_storage_repo || inputs.source_storage_repo || 'raven-build-storage' }}
  SOURCE_TAG: ${{ github.event.client_payload.source_release_tag || inputs.source_release_tag }}
  SOURCE_FILENAME: ${{ github.event.client_payload.source_filename || inputs.source_filename || 'raven-flutter-build.zip' }}
  TARGET_CHAT_ID: ${{ github.event.client_payload.target_chat_id || inputs.target_chat_id }}
  PROJECT_NAME: ${{ github.event.client_payload.project_name || inputs.project_name || 'raven-build-source' }}
  TOKEN_BOT: ${{ secrets.TOKEN_BOT }}
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  MAX_SOURCE_BYTES: '2147483647'

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for NAME in TELEGRAM_API_ID TELEGRAM_API_HASH TOKEN_BOT TARGET_CHAT_ID SOURCE_OWNER SOURCE_REPO SOURCE_TAG; do
            [ -n "${!NAME}" ] || { echo "$NAME belum tersedia" >&2; exit 1; }
          done
          echo "SOURCE_DIR=$RUNNER_TEMP/raven-source-transfer" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MTProto worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install 'Telethon>=1.40,<2'
          python3 -m pip install cryptg || true

      - name: Download source release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          gh release download "$SOURCE_TAG" --repo "$SOURCE_OWNER/$SOURCE_REPO" --dir "$SOURCE_DIR" --clobber
          FILE="$SOURCE_DIR/$SOURCE_FILENAME"
          if [ ! -f "$FILE" ]; then FILE="$(find "$SOURCE_DIR" -maxdepth 1 -type f -print -quit)"; fi
          [ -n "$FILE" ] && [ -f "$FILE" ]
          SIZE="$(stat -c '%s' "$FILE")"
          [ "$SIZE" -le "$MAX_SOURCE_BYTES" ]
          {
            echo "SOURCE_FILE=$FILE"
            echo "SOURCE_SIZE_ACTUAL=$SIZE"
            echo "SOURCE_SIZE_MB=$(python3 -c "print(round($SIZE/1048576,2))")"
          } >> "$GITHUB_ENV"

      - name: Send source to owner
        shell: bash
        env:
          OUTPUT_KIND: zip
          OUTPUT_PATH: ${{ env.SOURCE_FILE }}
          OUTPUT_CAPTION: |
            📦 <b>GET ZIP BUILD</b>
            ━━━━━━━━━━━━━━━━━━━━━

            📋 Project : <code>${{ env.PROJECT_NAME }}</code>
            📁 Source  : <b>${{ env.SOURCE_FILENAME }}</b>
            📏 Ukuran  : <b>${{ env.SOURCE_SIZE_MB }} MB</b>

            ✅ Source ZIP siap dipakai.
        run: |
          set -euo pipefail
          python3 scripts/raven-telegram-mtproto.py send-file
